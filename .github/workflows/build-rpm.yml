name: Build RPM

# 브랜치 push 시 RPM 을 빌드하고 빌드서버 /users/rpm 에 보관한다.
# (설치/재기동/헬스체크는 하지 않음 — 현행 UI 운영 수준 유지)
#
# UI 의 RPM 빌드는 EDC 와 달리 pom 의 maven-antrun-plugin(install 단계)이
# 빌드서버로 SSH(비밀번호) 접속하여 rpmwand 로 "원격 빌드" 하고,
# 같은 세션에서 결과 RPM 을 빌드서버 로컬의 /users/rpm 에 복사한다(pom Step 6-1).
# 이후 antrun 이 RPM 을 러너의 ./target/RPMS/ 로도 회수한다.
# => 러너는 별도의 키/scp 없이 mvn install 만 실행하면 된다.
#
# 빌드서버(10.200.10.64/65) 접근이 필요하므로 self-hosted ui-runner 에서만 실행된다.
# 제품 정보(artifactId/version/buildHost)는 각 브랜치의 pom.xml 에서 추출하므로
# 이 파일은 master / emass_2ndDev 에 동일하게 커밋해도 각 제품으로 동작한다.

on:
  push:
    branches: [master, emass_2ndDev]
  workflow_dispatch:

concurrency:
  group: build-rpm-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write   # 버전 태그 push 용 (기존 read → write)

jobs:
  build-rpm:
    name: build-rpm
    runs-on: [self-hosted, xcurenet-lab-deploy]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 버전 확인
        shell: bash
        run: |
          # self-hosted 러너는 서버 기본 Java 를 그대로 사용하므로,
          # 서버 Java 교체 시 조용한 버전 불일치를 막기 위해 기대 버전(11)을 검증한다.
          JAVA_MAJOR=$(java -version 2>&1 | head -1 | sed -E 's/.*"([0-9]+)[."].*/\1/')
          if [ "${JAVA_MAJOR}" != "11" ]; then
            echo "::error::러너 Java 가 11이 아닙니다 (현재: ${JAVA_MAJOR}). 빌드 서버의 기본 Java 를 확인하십시오."
            exit 1
          fi
          echo "Java ${JAVA_MAJOR} OK"

      - name: Secret 확인
        shell: bash
        run: |
          # 미등록 secret 은 빈 문자열로 치환되어 빈 비밀번호로 SSH 인증을 시도하게 된다.
          # (재발 방지: Too many authentication failures 사전 차단)
          if [ -z '${{ secrets.UI_BUILD_PASSWORD }}' ]; then
            echo "::error::UI_BUILD_PASSWORD secret 이 등록되지 않았습니다. Settings > Secrets and variables > Actions 에서 등록하십시오."
            exit 1
          fi
          echo "UI_BUILD_PASSWORD OK"

      - name: 제품 정보 추출 (pom.xml)
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          VERSION=$(mvn  -q -DforceStdout help:evaluate -Dexpression=project.version)
          BUILD_HOST=$(mvn -q -DforceStdout help:evaluate -Dexpression=buildHost)
          echo "artifact=${ARTIFACT}"     >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"       >> "$GITHUB_OUTPUT"
          echo "build_host=${BUILD_HOST}" >> "$GITHUB_OUTPUT"
          echo "제품=${ARTIFACT} 버전=${VERSION} 빌드서버=${BUILD_HOST}"

      - name: RPM 빌드 + /users/rpm 보관 (빌드서버 원격 SSH)
        shell: bash
        run: |
          set -euo pipefail
          # antrun 의 build-rpm execution 이 비밀번호 인증으로 빌드서버에서 RPM 을 빌드하고,
          # publish-rpm execution 이 -Drpm.publish.skip=false 일 때만 /users/rpm 으로 복사한다.
          # 빌드서버 비밀번호는 pom 평문 대신 Actions Secret 으로 주입한다.
          mvn -B -ntp clean install \
              -Dmaven.test.skip=true \
              -Drpm.publish.skip=false \
              -DbuildPassword='${{ secrets.UI_BUILD_PASSWORD }}'

      - name: RPM 확인 (러너 회수본)
        id: rpm
        shell: bash
        run: |
          set -euo pipefail
          RPM_FILE=$(find target/RPMS -maxdepth 1 -name '*.rpm' | head -1)
          if [ -z "${RPM_FILE}" ]; then
            echo "::error::RPM 파일이 생성되지 않았습니다. (target/RPMS 확인)"
            exit 1
          fi
          echo "rpm_name=$(basename "${RPM_FILE}")" >> "$GITHUB_OUTPUT"
          ls -lh "${RPM_FILE}"

      - name: 버전 태그 생성 (커밋-RPM 버전 매핑 기록)
        shell: bash
        run: |
          # 배포된 RPM 버전을 커밋에 영구 기록하여
          # "몇 버전에 문제가 있었는지"를 git log 로 추적 가능하게 한다.
          # 제품이 2개(master→emassai, emass_2ndDev→emassai_plus)이므로
          # 태그에 artifact 명을 접두어로 포함해 구분한다.
          # 조회: git tag -l 'emassai-v*' / git tag -l 'emassai_plus-v*'
          TAG="${{ steps.meta.outputs.artifact }}-v${{ steps.meta.outputs.version }}-$(TZ=Asia/Seoul date +%Y%m%d%H%M)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "RPM: ${{ steps.rpm.outputs.rpm_name }} (branch: ${{ github.ref_name }})" || {
            echo "::warning::태그가 이미 존재합니다: ${TAG}"; exit 0; }
          git push origin "${TAG}" || echo "::warning::태그 push 실패 (빌드는 정상)"
          echo "태그 생성: ${TAG}"

      - name: 빌드 결과 요약
        if: always()
        shell: bash
        run: |
          {
            echo "## RPM 빌드 결과"
            echo ""
            echo "| 항목 | 값 |"
            echo "|------|-----|"
            echo "| 브랜치 | ${{ github.ref_name }} |"
            echo "| 제품 | ${{ steps.meta.outputs.artifact }} |"
            echo "| 버전 | ${{ steps.meta.outputs.version }} |"
            echo "| 빌드서버 | ${{ steps.meta.outputs.build_host }} |"
            echo "| RPM | ${{ steps.rpm.outputs.rpm_name || '생성 실패' }} |"
            echo "| 보관 위치 | ${{ steps.meta.outputs.build_host }}:/users/rpm/ |"
            echo "| Git 태그 | ${{ steps.meta.outputs.artifact }}-v${{ steps.meta.outputs.version }}-* (태그 스텝 참조) |"
          } >> "$GITHUB_STEP_SUMMARY"
