name: Security Scan

# 의존성 보안 취약점 스캔 (Trivy)
# - pom.xml 의존성 + src/main/webapp/WEB-INF/lib 의 커밋된 jar 실물을 스캔
# - CRITICAL 발견 시 실패 (게이트)
#
# self-hosted 이관 (2026-07-21, 비용 절감):
# - trivy-action(3월 공급망 침해 이력) 의존 제거, 러너 사전 설치 바이너리 직접 실행
# - DB 는 mirror.gcr.io / ghcr.io 에서 다운로드 (러너 아웃바운드 확인 완료)
# - 러너 전제: /usr/local/bin/trivy 설치
#
# 도입 단계:
#   1단계(현재): Ruleset 필수 체크 미등록 → 실패해도 병합 가능 (리포트 용도)
#   2단계: 트리아지 후 수용 위험을 .trivyignore 에 근거와 함께 등록,
#          Ruleset required_status_checks 에 "security-scan" 추가하여 게이트 승격
#
# 이 파일은 master / emass_2ndDev 양 브랜치에 동일하게 커밋한다.

on:
  pull_request:
    branches: [master, emass_2ndDev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-scan:
    name: security-scan
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: [self-hosted, xcurenet-lab-deploy]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: trivy 확인
        shell: bash
        run: |
          command -v trivy >/dev/null || { echo "::error::러너에 trivy 가 없습니다. /usr/local/bin/trivy 설치 후 재시도하십시오."; exit 1; }
          trivy --version | head -1

      - name: Trivy 취약점 스캔 (CRITICAL 게이트)
        shell: bash
        run: |
          set -euo pipefail
          # 패치 존재(fixed) 항목만, .trivyignore 의 수용 위험 제외, CRITICAL 발견 시 실패
          trivy fs . \
            --scanners vuln \
            --severity CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1

      - name: 참고용 전체 리포트 (HIGH 포함, 실패 없음)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          trivy fs . \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 0 \
            --format table \
            --output trivy-report.txt || true
          {
            echo "## 보안 스캔 리포트 (CRITICAL/HIGH, 패치 존재 항목만)"
            echo ""
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo "리포트 없음"
            echo '```'
            echo ""
            echo "- 게이트 기준: CRITICAL (수용 위험은 .trivyignore 에 근거와 함께 등록)"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f trivy-report.txt
