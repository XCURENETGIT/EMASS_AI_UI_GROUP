######################################################################################
#                      Application Configuration                                     #
######################################################################################
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
server.tomcat.max-http-form-post-size=-1
server.tomcat.resource.allow-caching=true
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=1GB
spring.main.banner-mode=log
spring.main.allow-circular-references=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/**
spring.cloud.config.enabled=false
spring.web.resources.cache.period=3600
jasypt.encryptor.bean=jasyptStringEncryptor


######################################################################################
#                             MariaDB \u00EC\u0084\u00A4\u00EC\u00A0\u0095                                            #
######################################################################################
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB103Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=EMASSAI
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.sql.init.encoding=UTF-8
spring.sql.init.mode=always
spring.sql.init.schema-locations= classpath:com/xcurenet/sqlmap/mappers/sql/schema-create_table.sql
spring.sql.init.data-locations = classpath:com/xcurenet/sqlmap/mappers/sql/data-insert_data.sql, classpath:com/xcurenet/sqlmap/mappers/sql/data-patch_data.sql
spring.jpa.defer-datasource-initialization=false
