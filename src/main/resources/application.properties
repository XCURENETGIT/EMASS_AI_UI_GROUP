######################################################################################
#                       EMASS AI KAFKA Configuration                                 #
######################################################################################
# EMASS AI KAFKA 서버 (주소 변경 필수)
spring.kafka.bootstrap-servers= emassai1:9092,emassai2:9092,emassai3:9092
spring.kafka.listener.ack-mode= manual-immediate
spring.kafka.listener.ack-time= 500
spring.kafka.listener.concurrency = 32
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.key-serializer= org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer= org.apache.kafka.common.serialization.StringSerializer
kafka.checked.index = ems_ui_checked_index


######################################################################################
#                             ElasticSearch Configuration                            #
######################################################################################
# EMASS AI 색인 서버 (주소 변경 필수)
spring.elasticsearch.uris=emassai1:9200,emassai1:9200,emassai1:9200
spring.elasticsearch.connection-timeout=300s
spring.elasticsearch.socket-timeout=300s
spring.elasticsearch.restclient.sniffer.interval=5m
spring.elasticsearch.restclient.sniffer.delay-after-failure=30s
#spring.elasticsearch.username=
#spring.elasticsearch.password=



######################################################################################
#                      Application Configuration                                     #
######################################################################################
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
server.tomcat.max-http-form-post-size=-1
server.tomcat.resource.allow-caching=true
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=1GB
spring.main.banner-mode=log
spring.main.allow-circular-references=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/**
spring.cloud.config.enabled=false
spring.web.resources.cache.period=3600
jasypt.encryptor.bean=jasyptStringEncryptor


######################################################################################
#                             MariaDB 설정                                            #
######################################################################################
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB103Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=EMASSAI
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.sql.init.encoding=UTF-8
spring.sql.init.mode=always
spring.sql.init.schema-locations= classpath:com/xcurenet/sqlmap/mappers/sql/schema-create_table.sql
spring.sql.init.data-locations = classpath:com/xcurenet/sqlmap/mappers/sql/data-insert_data.sql
spring.jpa.defer-datasource-initialization=false
