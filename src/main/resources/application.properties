######################################################################################
#                       EMASS AI KAFKA Configuration                                 #
######################################################################################
spring.kafka.bootstrap-servers= XCN1:9092,XCN2:9092,XCN3:9092
spring.kafka.listener.ack-mode= manual-immediate
spring.kafka.listener.ack-time= 500
