DASHBOARD_MENU.msg.header=
ANALYSIS_INFO.msg.header=This is a screen that inquires about the relationship of personal information leakage.
ANALYSIS_SEARCH.msg.header=This is a screen that queries web search word trend analysis.
REPORT_CONTENT.msg.header = Screen that allows you to write report according to user\u2019s intended use.<br>Set up period and statistics items to output a report on the desired statistics item.
DASHBOARD_SETUP.msg.header=Dashboard provided by default when creating an operator account cannot be deployed.
INTEREST_USER.msg.header=Designate marked users per administrator to use user information for dashboard and message search.<br>Use the Select/Register Existing User button to select a user from HR informatoin or enter a marked users directly.
STAT_REPORT.msg.header=Screen that allows you to write report according to user\u2019s intended use.<br>Set up period and statistics items to output a report on the desired statistics item.
RESERVATION_ALARM.msg.header=Use the settings selected by the administrator to manage the function of receiving notification regulary.<br>You can use email or SMS to receive results.<br>
KEYWORD_MGMT.msg.header=If any registered keyword is detected in the collected data, the data is tagged.<br> The data tagged based on the keyword is used for search and statistic materials.
CONSENT_MGMT.msg.header=The consent form function registers audit targets in advance and retrieves relevant users.<br/>If you don\u2019t select an consent form on the message information screen, you can retrieve the message list only.
ANALYSIS_RELATION.msg.header=Screen that retrieves data relation.
ANALYSIS_FLUCTUATION.msg.header=Screen that retrieves usage fluctuation.
RELATION_KEYWORD.msg.header=Manage related keyword.
REGEX_PATTERN.msg.header=Managing Regular Expression Patterns for Recognizing Strings with Specific Formats and Rules
ANALYSIS_CUSTOM.msg.header=Screen that analyzes desired statistic data in various formats.
