pattern.info.exeample1=^: Specifies the start of a string or line. For example, ^0 represents the string starting with ‘0.’
pattern.info.exeample2=ex) If ‘^’ is enclosed in square brackets, as in [^0], it does not mean starting.
pattern.info.exeample3=$: Specifies the end of a string or line.
pattern.info.exeample4=ex) 0$ represents the strings ending with ‘0.’
pattern.info.exeample5=*: Means that more than 0 letters or numbers appear. 
pattern.info.exeample6=ex) a* indicates more than 0 letters or numbers following ‘a.’
pattern.info.exeample7=+:Means that one or more characters appear.
pattern.info.exeample8=ex) [nop]+ matches one or more letters n, o, or p.
pattern.info.exeample9=. :  Matches any single character. 
pattern.info.exeample10=ex) To match a period, you must use the forward slash (\) used escape character. For example, enter ‘\.’.
pattern.info.exeample11=[...]: Square brackets [ ] match special characters within them.
pattern.info.exeample12=ex) [a-z] matches one lowercase letter between a and z. T[ao]p matches Tap or Top.
pattern.info.exeample13=ex) [A-C][0-3][g-i] matches strings such as A0g, A0h, B1i, and C3g.
pattern.info.exeample14={...}: 	The curly braces { } indicate repetition.
pattern.info.exeample15=ex) t{2} returns two t's, [def]{3} returns three characters: d, e, f, and so on, and {1,4} matches all characters 1-4.
pattern.info.exeample16=? :  The question mark ? matches 0 or 1 preceding character or group.
pattern.info.exeample17=ex) 12?3 matches 123 or 13.


