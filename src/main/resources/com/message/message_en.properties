STAT_SVC.msg.header=
STAT_KWD.msg.header=
STAT_ATTACHTYPE.msg.header=
STAT_ATTACHNAME.msg.header=
STAT_URL.msg.header=
ANALYSIS_SEARCH.msg.header=This window searches for the web keyword trend analyses.
ANALYSIS_INFO.msg.header=This window searches for personal information leakage relations.
STAT_ADMINREAD.msg.header=
STAT_DEVTRAFFIC.msg.header=
STAT_OCR.msg.header=
REPORT_CONTENT.msg.header =This window lets the user write the report according to his/her purpose.<br>Set the period and the statistics item, and print the report for the statistics item.
POLICY_NOLOG.msg.header=It manages logging/no-logging targets used in the system.
DEV_INFO.msg.header=You can check the device information.
DEV_EVENTLOG.msg.header=The Device Event Log window displays each device's status changes and abnormalities, including the CPU, memory, HDD, process, service, and network traffic.
ORG_MGMT.msg.header=It manages the organization code information used in the system. Managed are the company, office, division, department, position, and employment codes.<br>If you set the HR interworking setting to Automatic, the Add and Delete buttons will be hidden.<br>If you will manage it manually, set the HR interworking setting in the User Management Window to ‘Direct Input.’
USER_MGMT.msg.header=For the user information, the manager registers, modifies, and deletes the information of his/her subordinates to manage. You can select the Division, Office, and Department after you select the Company.<br>If the User is CEO, you must select CEO for the User classification field in the ‘Add’ or ‘Modify’ window. The user selected as CEO is excluded from the search target.<br>After setting the user information, click the ‘Apply HR information’ button. (The changed information is applied finally.)
USER_GROUP_MGMT.msg.header=The user group function manages users as groups.<br>You can add up to 1000 users in a group.
BUSI_IPRANGE.msg.header=The Office Internal IP Setting window manages IP information by office.<br>The registered IP information assigns the office information of messages during the message collection and logging process. It is applied in the search and internal/external information of the collected messages.
DEPT_IPRANGE.msg.header=The Department Internal IP Setting window manages IP information by department.<br>The registered IP information assigns the department information of messages during the message collection and logging process. It is applied in the search and internal/external information of the collected messages.
CODE_INFO.msg.header=This window shows the types of services and files used in the system.
ADMIN_MGMT.msg.header=The window manages administrators who access the screen and use the system.<br>The administrator type is divided into system administrator and monitoring administrator. The system administrator can set the system and manage codes.<br>Register the E-mail address and HP number to allow receiving the event information of each function.
HOLIDAY_BUSI.msg.header=Manages the business time and holidays by office.
HOLIDAY_LEGAL.msg.header=Manages legal holiday information.
SEARCH_LOG.msg.header=The Search Log window manages the message information search history.
AUDIT_LOG.msg.header=The Administrator Audit Log window searches for the work history of administrators. The administrator audit logs are not deleted.
RECOMMEND.msg.header= It lists the top 100 documents in the last month that are similar to the selected document, ranked by similarity (%). &nbsp; Similarity Analysis Items (Cotent, Attachment, and Title)
BUSI_IPRANGE_VIEW.msg.header=It lists the office’s internal IPs that match the monitoring administrator's authority.
DEPT_IPRANGE_VIEW.msg.header=It lists the department’s internal IPs.
STAT_KEYWORDHOST.msg.header= This is a statistics screen for core technology keyword detection.
STAT_KEYWORDNEW.msg.header= This is a statistics screen for new core technology keyword detection.
ANALYSIS_SIMILARITY.msg.header=This window that inquires about similarity analysis.
STAT_GW_ATTACHTYPE.msg.header=This is a screen where you can check the transfer capacity by groupware attachment file type.

