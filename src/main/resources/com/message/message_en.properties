POLICY_NOLOG.msg.header=Manages the logging/non-logging items used in the system.
DEV_INFO.msg.header=This screen provides device information.
DEV_EVENTLOG.msg.header=In the device event log screen, abnormal status can be searched. Abnormal cases are such as status changes of each device, CPU, memory, HDD, process, service status, network traffic and Etc.
ORG_MGMT.msg.header=Manages the organization information used by the system. Manages company, office, division, department, position and employment codes.<br />If you set the HR automatic interworking, the Add and Delete buttons are deactivated. If you want to manage manually, go to User Management screen and set the HR automatic interworking to \u201Cmanual interworking\u201D.
USER_MGMT.msg.header=Administrator registers, modifies or delete a user. you can work on division, office, and department, after selecting a company.<br>If the user is CEO, select CEO for the classification field when you add or modify the user. The user selected as CEO is excluded from search targets.<br>Set up the user information and click the Apply HR information button (the changed information is applied finally.)
USER_GROUP_MGMT.msg.header=A user group manages the user as a group.<br>The group can contain up to 10 users.
BUSI_IPRANGE.msg.header=The office internal IP setting screen is used to manage IP address info per office.<br>The registered IP address information provides the office information of the message, while logging and collecting messages, and are applied to the search on the collected messages and external information.
DEPT_IPRANGE.msg.header=The department internal IP setting screen is used to manage IP address info per department.<br>The registered IP address information provides the department information of the message, while logging and collecting messages, and are applied to the search on the collected messages and external information.
CODE_INFO.msg.header=Retrieves service types and file types used in the system.
ADMIN_MGMT.msg.header=This screen manages administrators who accesses the screen to use the system.<br>The administrator types are divided into the system administrator and the monitoring administrator. The system administrator can set up the system and manage codes.<br>To receive the event info for each function, please register your email address and mobile phone number. Agreement is needed from some nations to support the short message service.
HOLIDAY_BUSI.msg.header=Manages business hour/holiday information per office.
HOLIDAY_LEGAL.msg.header=Manages Legal holiday information.
SEARCH_LOG.msg.header=The view log screen displays the message information view history.
AUDIT_LOG.msg.header=The administrator audit log screen retrieves the work details of administrators.<br>The administrator audit log is not deleted.
RECOMMEND.msg.header=The TOP 100 documents from the past month that have similarity to the selected document are displayed in similarity (%) ranking.  &nbsp;  Similarity analyze items (content, attached file, title)
BUSI_IPRANGE_VIEW.msg.header=You can check the internal IP of the business place that suits the operator's business establishment authority.
DEPT_IPRANGE_VIEW.msg.header=You can check the internal IP of the department place.

