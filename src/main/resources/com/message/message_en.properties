DASHBOARD_MENU.msg.header=
RELATION_KEYWORD.msg.header =It manages relation keywords.
REGEX_PATTERN.msg.header =It manages regular expression patterns that identify strings with specific types and rules.
DASHBOARD_SETUP.msg.header=You cannot distribute the dashboard created by default when creating the administrator account.
INTEREST_USER.msg.header=Marked users are designated per administrator to use their information in the dashboard, message search, etc.<br>Using the existing ‘Select user’ and ‘Add’ buttons, you can select a user from the HR information or add the market user directly.
STAT_REPORT.msg.header=The Report window lets the user write the report according to his/her purpose.<br>Set the period and the statistics item, and print the report for the statistics item.
RESERVATION_ALARM.msg.header=This window manages the function to receive notifications regularly based on the settings selected by the administrator.<br>You can receive the result using E-Mail or SMS.
KEYWORD_MGMT.msg.header=The keyword function registers specific words in advance as keywords. If any registered keywords are detected from the data collected, it tags the data.<br>The keyword-tagged data are used for search and statistics materials.
CONSENT_MGMT.msg.header=The Consent Form function searches for audit target users by registering them in advance.<br>If the consent form is not selected from the Message Information window, it is possible to search the message list only.
ANALYSIS_RELATION.msg.header=This window searches for the data relations.
ANALYSIS_FLUCTUATION.msg.header=This window searches for the usage increases/decreases.
ANALYSIS_CUSTOM.msg.header=This window is to analyze desired statistics data in the various types.
