ORG_MGMT.msg.header=\uC2DC\uC2A4\uD15C\uC5D0\uC11C \uC0AC\uC6A9\uB418\uB294 \uC870\uC9C1 \uCF54\uB4DC \uC815\uBCF4\uB97C \uAD00\uB9AC \uD569\uB2C8\uB2E4. \uD68C\uC0AC, \uC0AC\uC5C5\uC7A5, \uCD1D\uAD04, \uBD80\uC11C, \uC9C1\uAE09, \uC7AC\uC9C1 \uCF54\uB4DC\uB97C \uAD00\uB9AC \uD569\uB2C8\uB2E4.<br>\uC778\uC0AC \uC5F0\uB3D9\uC744 \uC790\uB3D9\uC73C\uB85C \uC124\uC815 \uD560 \uACBD\uC6B0 \uCD94\uAC00, \uC0AD\uC81C \uBC84\uD2BC\uC774 \uBCF4\uC774\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.<br>\uC218\uB3D9\uC73C\uB85C \uAD00\uB9AC\uB97C \uD558\uC2E4 \uACBD\uC6B0 \uC0AC\uC6A9\uC790 \uAD00\uB9AC \uD654\uBA74\uC5D0\uC11C \uC778\uC0AC\uC5F0\uB3D9 \uC124\uC815\uC744 "\uC9C1\uC811\uC785\uB825"\uC73C\uB85C \uC124\uC815 \uD558\uC2DC\uAE30 \uBC14\uB78D\uB2C8\uB2E4.
USER_MGMT.msg.header=\uC0AC\uC6A9\uC790 \uC815\uBCF4\uB294 \uAD00\uB9AC\uC790\uAC00 \uAD00\uB9AC \uD560 \uD53C\uAD00\uB9AC\uC790\uC758 \uC815\uBCF4\uB97C \uB4F1\uB85D \uBC0F \uC218\uC815, \uC0AD\uC81C\uB97C \uD569\uB2C8\uB2E4. \uCD1D\uAD04,\uC0AC\uC5C5\uC7A5,\uBD80\uC11C\uB294 \uD68C\uC0AC\uB97C \uC120\uD0DD \uD55C \uB4A4\uC5D0 \uC120\uD0DD \uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.<br>\uC0AC\uC6A9\uC790\uAC00 CEO\uC778 \uACBD\uC6B0 \uCD94\uAC00 \uBC0F \uC218\uC815\uC5D0\uC11C \uAD6C\uBD84 \uD544\uB4DC\uB97C \uBC18\uB4DC\uC2DC CEO\uB85C \uC120\uD0DD \uD574 \uC8FC\uC5B4\uC57C \uD558\uBA70 CEO\uB85C \uC120\uD0DD \uB41C \uC0AC\uC6A9\uC790\uB294 \uC870\uD68C \uB300\uC0C1\uC5D0\uC11C \uC81C\uC678 \uB429\uB2C8\uB2E4.<br>\uC0AC\uC6A9\uC790 \uC815\uBCF4\uB97C \uC124\uC815 \uD6C4 \uC778\uC0AC\uC815\uBCF4 \uBC18\uC601 \uBC84\uD2BC\uC744 \uD074\uB9AD \uD558\uC2ED\uC2DC\uC624.(\uBCC0\uACBD\uB41C \uC815\uBCF4\uB97C \uCD5C\uC885\uC73C\uB85C \uBC18\uC601\uD569\uB2C8\uB2E4.)
USER_GROUP_MGMT.msg.header=\uC0AC\uC6A9\uC790 \uADF8\uB8F9\uC740 \uC0AC\uC6A9\uC790\uB97C \uADF8\uB8F9\uC73C\uB85C \uAD00\uB9AC\uD569\uB2C8\uB2E4.<br>\uADF8\uB8F9\uC5D0 \uD3EC\uD568\uB418\uB294 \uC0AC\uC6A9\uC790\uB294 \uCD5C\uB300 1000\uBA85\uC785\uB2C8\uB2E4.
BUSI_IPRANGE.msg.header=\uC0AC\uC5C5\uC7A5 \uB0B4\uBD80 IP \uC124\uC815 \uD654\uBA74\uC740 \uC0AC\uC5C5\uC7A5 \uBCC4 IP \uC815\uBCF4\uB97C \uAD00\uB9AC \uD569\uB2C8\uB2E4.<br>\uB4F1\uB85D\uB41C IP \uC815\uBCF4\uB294 \uBA54\uC2DC\uC9C0\uC758 \uC218\uC9D1, \uB85C\uAE45 \uACFC\uC815\uC5D0\uC11C \uBA54\uC2DC\uC9C0\uC758 \uC0AC\uC5C5\uC7A5 \uC815\uBCF4\uB97C \uBD80\uC5EC\uD558\uACE0, \uC218\uC9D1\uB41C \uBA54\uC2DC\uC9C0\uC758 \uAC80\uC0C9\uACFC \uB0B4\uBD80/\uC678\uBD80 \uC815\uBCF4\uC5D0 \uBC18\uC601 \uB429\uB2C8\uB2E4.
DEPT_IPRANGE.msg.header=\uBD80\uC11C \uB0B4\uBD80 IP \uC124\uC815 \uD654\uBA74\uC740 \uBD80\uC11C \uBCC4 IP \uC815\uBCF4\uB97C \uAD00\uB9AC \uD569\uB2C8\uB2E4.<br>\uB4F1\uB85D\uB41C IP \uC815\uBCF4\uB294 \uBA54\uC2DC\uC9C0\uC758 \uC218\uC9D1, \uB85C\uAE45 \uACFC\uC815\uC5D0\uC11C \uBA54\uC2DC\uC9C0\uC758 \uBD80\uC11C \uC815\uBCF4\uB97C \uBD80\uC5EC\uD558\uACE0, \uC218\uC9D1\uB41C \uBA54\uC2DC\uC9C0\uC758 \uAC80\uC0C9\uACFC \uB0B4\uBD80/\uC678\uBD80 \uC815\uBCF4\uC5D0 \uBC18\uC601 \uB429\uB2C8\uB2E4.
