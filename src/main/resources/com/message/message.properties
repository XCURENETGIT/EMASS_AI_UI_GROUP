DASHBOARD_MENU.msg.header=
RELATION_KEYWORD.msg.header = 연관 키워드를 관리합니다.
ANALYSIS_INFO.msg.header=개인정보 유출 관계를 조회하는 화면입니다.
REGEX_PATTERN.msg.header = 특정한 형태와 규칙을 가진 문자열을 파악하는 정규식 패턴을 관리합니다.
ANALYSIS_SEARCH.msg.header=웹 검색어 동향 분석을 조회하는 화면 입니다.
REPORT_CONTENT.msg.header = 사용자의 용도에 따라 리포트를 작성할 수 있는 화면입니다.<br>기간과 통계 항목을 설정하여 해당 통계 항목에 대한 리포트를 출력합니다.
DASHBOARD_SETUP.msg.header=운용자 계정 생성 시 기본으로 제공되는 Dashboard 는 배포할 수 없습니다.
INTEREST_USER.msg.header=운용자별 관심 사용자를 지정하여 해당 관심 사용자에 대한 정보를 Dashboard, 메시지 조회 등에 활용 합니다.<br>기존 사용자 선택/등록 버튼을 통해 인사정보에서 사용자를 선택 하거나 직접 관심 사용자를 입력 할 수 있습니다.
STAT_REPORT.msg.header=사용자의 용도에 따라 리포트를 작성할 수 있는 화면입니다.<br>기간과 통계 항목을 설정하여 해당 통계 항목에 대한 리포트를 출력합니다.
RESERVATION_ALARM.msg.header=운용자가 선택한 설정으로 주기적인 알림을 받아볼 수 있는 기능을 관리하는 화면 입니다.<br>E-Mail, SMS를 사용하여 결과를 받아볼 수 있습니다.
KEYWORD_MGMT.msg.header=예약어는 특정 단어를 미리 등록 후 수집되는 데이터가 등록 한 예약어에 검출 된 경우 해당 데이터를 태깅(Tag) 하는 기능 입니다.<br>예약어로 태깅(Tag)된 데이터는 검색 및 통계 자료로 활용 됩니다.
CONSENT_MGMT.msg.header=동의서 기능은 감사 대상자를 미리 등록 후 해당 사용자를 조회 하는 기능입니다.<br>메시지 정보 화면에서 동의서를 선택하지 않을 경우 메시지 목록만 조회 가능 합니다.
ANALYSIS_RELATION.msg.header=데이터 관계를 조회하는 화면입니다.
ANALYSIS_FLUCTUATION.msg.header=사용량 증감을 조회하는 화면입니다.
ANALYSIS_CUSTOM.msg.header=원하는 통계데이터를 다양한 형식으로 분석할 수 있는 화면입니다.
