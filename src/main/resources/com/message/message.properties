POLICY_NOLOG.msg.header=시스템에서 사용되는 로깅/미로깅 대상에 대한 관리를 합니다.
DEV_INFO.msg.header=장비 정보를 확인할 수 있습니다.
DEV_EVENTLOG.msg.header=장비 이벤트 로그 화면은 각 장비의 상태 변경, cpu, memory, hdd, 프로세스, 서비스 상태, 네트워크 트래픽 등 각 장비의 상태 이상 내역을 조회 합니다.
ORG_MGMT.msg.header=시스템에서 사용되는 조직 코드 정보를 관리 합니다. 회사, 사업장, 총괄, 부서, 직급, 재직 코드를 관리 합니다.<br>인사 연동을 자동으로 설정 할 경우 추가, 삭제 버튼이 보이지 않습니다.<br>수동으로 관리를 하실 경우 사용자 관리 화면에서 인사연동 설정을 "직접입력"으로 설정 하시기 바랍니다.
USER_MGMT.msg.header=사용자 정보는 관리자가 관리 할 피관리자의 정보를 등록 및 수정, 삭제를 합니다. 총괄,사업장,부서는 회사를 선택 한 뒤에 선택 할 수 있습니다.<br>사용자가 CEO인 경우 추가 및 수정에서 구분 필드를 반드시 CEO로 선택 해 주어야 하며 CEO로 선택 된 사용자는 조회 대상에서 제외 됩니다.<br>사용자 정보를 설정 후 인사정보 반영 버튼을 클릭 하십시오.(변경된 정보를 최종으로 반영합니다.)
USER_GROUP_MGMT.msg.header=사용자 그룹은 사용자를 그룹으로 관리합니다.<br>그룹에 포함되는 사용자는 최대 1000명입니다.
BUSI_IPRANGE.msg.header=사업장 내부 IP 설정 화면은 사업장 별 IP 정보를 관리 합니다.<br>등록된 IP 정보는 메시지의 수집, 로깅 과정에서 메시지의 사업장 정보를 부여하고, 수집된 메시지의 검색과 내부/외부 정보에 반영 됩니다.
DEPT_IPRANGE.msg.header=부서 내부 IP 설정 화면은 부서 별 IP 정보를 관리 합니다.<br>등록된 IP 정보는 메시지의 수집, 로깅 과정에서 메시지의 부서 정보를 부여하고, 수집된 메시지의 검색과 내부/외부 정보에 반영 됩니다.
CODE_INFO.msg.header=시스템에서 사용되는 서비스 종류, 파일 종류에 대해 조회하는 화면 입니다.
ADMIN_MGMT.msg.header=화면에 접속하여 시스템을 이용하는 운용자를 관리하는 화면 입니다.<br>운용자 유형은 시스템 운용자, 모니터링 운용자로 나뉘며, 시스템 운용자는 시스템 설정 및 코드 관리등을 할 수 있습니다.<br>각 기능의 이벤트 정보를 받아 보시려면, E-mail, 핸드폰 번호를 등록 하십시오.
HOLIDAY_BUSI.msg.header=사업장 별 업무 시간/휴일 정보를 관리 합니다.
HOLIDAY_LEGAL.msg.header=법정 공휴일 정보를 관리 합니다.
SEARCH_LOG.msg.header=조회 이력 화면은 메시지 정보 조회 내역을 조회 합니다.
AUDIT_LOG.msg.header=운용자 감사 로그 화면은 운용자들의 작업 내역을 조회 합니다. 운용자 감사 로그는 삭제되지 않습니다.
RECOMMEND.msg.header= 선택한 문서와 유사성을 가진 최근 한 달간의 문서 TOP 100건을 유사도(%) 순위로 표시합니다. &nbsp; 유사성 분석 항목(내용,첨부파일,제목)
BUSI_IPRANGE_VIEW.msg.header=운용자의 사업장 권한에 맞는 사업장 내부 IP를 확인할 수 있습니다.
DEPT_IPRANGE_VIEW.msg.header=부서 내부 IP를 확인할 수 있습니다.

