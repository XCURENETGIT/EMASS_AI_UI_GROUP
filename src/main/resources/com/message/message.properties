pattern.info.exeample1=^ : 문자열 또는 줄의 시작을 지정합니다. 예를 들어 ^0은 0으로 시작하는 문자열과 일치합니다.
pattern.info.exeample2=ex)  [^0]처럼 ^ 문자가 대괄호 안에 들어 있다면, ^는 시작하지 않는다는 뜻입니다.
pattern.info.exeample3=s : 문자열 또는 줄의 끝을 지정합니다.
pattern.info.exeample4=ex) 0$는 0으로 끝나는 문자열과 일치합니다.
pattern.info.exeample5=* : 문자 또는 숫자가 0개 이상 나타남을 의미합니다. 
pattern.info.exeample6=ex) a*는 0개 이상의 문자와 일치합니다.
pattern.info.exeample7=+ :문자가 1개 이상 나타남을 의미합니다.
pattern.info.exeample8=ex) [nop]+는 n, o, p 글자가 하나 이상 있는 경우 일치합니다.
pattern.info.exeample9=. : 모든 문자 하나와 일치합니다. 
pattern.info.exeample10=ex) 마침표와 일치하려면, 슬래시를 이용한 이스케이프 문자를 써야 합니다. 예를 들어, \.라고 입력합니다.
pattern.info.exeample11=[...] : 대괄호 [ ]는 대괄호 안의 특수 문자와 일치합니다.
pattern.info.exeample12=ex)  [a-z]는 a부터 z 사이의 소문자 하나와 일치하며, T[ao]p은 Tap 또는 Top과 일치합니다.
pattern.info.exeample13=ex)  [A-C][0-3][g-i]는 A0g, A0h, B1i, C3g 등의 문자열과 일치합니다.
pattern.info.exeample14={...} : 	중괄호 { }는 반복을 나타냅니다.
pattern.info.exeample15=ex) t{2}는 두 개의 t를 반환하고, [def]{3}는 d, e, f로 된 세 자를 반환하며, .{1,4}는 모든 문자 1-4자와 일치합니다.
pattern.info.exeample16=? : 물음표 ?는 앞에 있는 문자 또는 그룹 0 또는 1개와 일치합니다.
pattern.info.exeample17=ex)  12?3은 123 또는 13과 일치합니다.


